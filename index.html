<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Copier Wizard</title>
<style>body{font-family:system-ui,sans-serif;padding:2rem;background:#f4f6f8;color:#18212b}</style>
</head>
<body>
<p id="status">Loading Copier Wizard Build 280…</p>
<script>
(async function(){
  const status = document.getElementById("status");
  try {
    status.textContent = "Downloading app…";
    const res = await fetch("app.gzip.b64");
    if (!res.ok) throw new Error("Failed to load app.gzip.b64 (" + res.status + ")");
    const b64 = (await res.text()).replace(/\s+/g, "");
    status.textContent = "Decoding…";
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    status.textContent = "Decompressing…";
    const ds = new DecompressionStream("gzip");
    const stream = new Blob([bytes]).stream().pipeThrough(ds);
    const html = await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  } catch (err) {
    status.innerHTML = "<strong>Could not load the app.</strong><br>" + String(err) +
      "<br><br>Please upload the full <code>index.html</code> from the Build 280 zip to this repository root.";
    console.error(err);
  }
})();
</script>
</body>
</html>
